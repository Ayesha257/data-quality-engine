# Base ruleset — applies to every client unless overridden.
#
# A client override file (config/clients/<client_id>/rules_v1.yaml) only
# needs to list the keys it wants to CHANGE. Everything else falls back
# to what's here. See config/clients/example_client/rules_v1.yaml for a
# worked example.

client_id: __base__
version: v1.0

thresholds:
  # Mirrors data_quality_engine/config/settings.py — Phase 1 defaults.
  # Keeping these here (not just in settings.py) lets Phase 2 vary them
  # per client without touching Phase 1 code at all.
  iqr_multiplier: 1.5
  fuzzy_threshold: 90
  fuzzy_max_unique: 500
  encoding_confidence_threshold: 0.8
  outlier_dominant_value_ratio: 0.3
  uniqueness_key_min_score: 0.6
  uniqueness_evidence_min_rows: 20

  # Phase 2-specific scoring gate: below this overall score, a run is
  # flagged for manual review before being sent onward (e.g. to M2's AI
  # explanation layer or M4's API consumers).
  min_acceptable_overall_score: 60.0

business_rules:
  - rule_id: no_negative_amounts
    description: "Monetary columns should not contain negative values unless explicitly a refund/credit column."
    condition: "value < 0 for columns matching '*Amt*' or '*Price*' or '*Cost*'"
    severity: medium

  - rule_id: id_columns_unique
    description: "Columns that look like identifiers (e.g. '*Code', '*No.', '*ID') should have unique values."
    condition: "duplicate rate > 0 for inferred identifier columns"
    severity: high
